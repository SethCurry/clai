# https://taskfile.dev

version: "3"

vars:
    GREETING: Hello, World!

tasks:
    test:
        cmds:
            - lein test
    build:
        sources:
            - "**/*.clj"
            - project.clj
        generates:
            - "target/**/*"
        cmds:
            - lein uberjar
    run:
        cmds:
            - lein run
