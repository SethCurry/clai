# https://taskfile.dev

version: "3"

tasks:
    test:
        cmds:
            - lein test
    build:
        sources:
            - "**/*.clj"
            - project.clj
        generates:
            - "target/**/*"
        cmds:
            - lein uberjar
    plugin:build:
        desc: Build the example today's-date plugin jar
        sources:
            - "src/clai_plugin_todays_date/**/*.clj"
            - project.clj
        generates:
            - "target/plugin/clai-plugin-todays-date.jar"
        cmds:
            - lein plugin-jar
    run:
        cmds:
            - lein run

includes:
    web:
        taskfile: ./taskfiles/web.yaml
    cljdoc:
        taskfile: ./taskfiles/cljdoc.yaml
